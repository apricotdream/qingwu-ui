# CI 发版 —— npm trusted publishing（OIDC），无需长效 token、不进 staged、2027-01 token 禁令后仍有效
#
# 前置（一次性）：每个包在 npmjs 网页 Settings → Trusted Publisher → Add GitHub Repository，
#   Owner=apricotdream / Repository=qingwu-ui / Workflow name=publish.yml（与下方 name 完全一致）
#
# 日常用法：本地对齐版本号 + CHANGELOG → push 到 GitHub main →
#   Actions → publish → Run workflow（packages 留空 = 自动发布所有"仓库有而 registry 无"的版本）
#   先勾 dry_run 可以看计划不真发。
name: publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "空格分隔包目录名（留空=自动检测全部版本差异）"
        required: false
        default: ""
      dry_run:
        description: "只列将要发布的包，不真发布"
        type: boolean
        default: false

permissions:
  contents: write # 立项诊断用：把探针报告推回 ci-diag 分支（排障完成后可收回 read）
  id-token: write # 向 GitHub 领取 OIDC 令牌，供 npm publish --provenance 验证

concurrency:
  group: publish
  cancel-in-progress: false # 发布中途绝不取消

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13" # 与 packageManager 一致

      # runner 自带 npm 10.9.9：无令牌 OIDC trusted publishing（含 --provenance）需 npm ≥ 11.5.1，
      # npm 10 在本地预检即强制要 NODE_AUTH_TOKEN 抛 ENEEDAUTH，不会发网络请求。
      # 装到独立前缀而不是 `sudo npm install -g npm@11`：sudo 走 secure_path，装出来的 npm 11
      # 落在 /usr/local/bin，而后续步骤的 PATH 里排在前面的是 toolcache 自带的 npm 10，
      # 发布时用的仍是旧 npm（run #1 就是这么失败在 ENEEDAUTH 上的）。前置 bin 目录确保生效。
      - name: 装一份支持 OIDC 的 npm 11 并前置进 PATH
        run: |
          npm install -g npm@11 --prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          "$HOME/.npm-global/bin/npm" -v

      # 确认后面真正调用到的是 npm 11（PATH 被抢占时会静默退回 npm 10）
      - run: |
          which npm
          npm -v

      - run: bun install --frozen-lockfile

      # 复用现有发布门禁：turbo build + publish-check（workspace 协议残留 / CHANGELOG 版本一致 / dist 齐全）
      - run: bun run release

      - id: pub
        run: bun tooling/ci-publish/index.mjs ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.packages }}

      # ⚠️ 临时排障（定位完就删）：把 OIDC 探针结果与 npm 调试日志推到 ci-diag 分支。
      # 起因：Actions 网页日志在本机代理下反复断连读不出来，而 git over SSH 是通的。
      # 只记录 HTTP 状态码/长度，绝不写入 JWT 或任何凭据值。
      - name: OIDC 探针并推回 ci-diag 分支（临时排障）
        if: always()
        run: |
          mkdir -p .ci-diag
          {
            echo "# publish run #${{ github.run_number }}  $(date -u +%FT%TZ)"
            echo
            echo "## 1. 环境变量是否存在"
            for k in ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_RUNTIME_TOKEN GITHUB_ACTIONS GITHUB_WORKFLOW_REF GITHUB_REPOSITORY GITHUB_REF; do
              if [ -n "${!k:-}" ]; then echo "$k: present"; else echo "$k: MISSING"; fi
            done
            echo
            echo "## 2. npm"
            echo "version: $(npm -v)"
            echo "path: $(which npm)"
            echo
            echo "## 3. 向 GitHub 换 OIDC 令牌（audience=npm:registry.npmjs.org）"
            if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              code=$(curl -sS -o /tmp/oidc.json -w '%{http_code}' \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" || echo "ERR")
              echo "github oidc http: $code"
              node -e '
                const fs = require("node:fs");
                try {
                  const j = JSON.parse(fs.readFileSync("/tmp/oidc.json", "utf8"));
                  if (!j.value) { console.log("响应里没有 value 字段：", JSON.stringify(j).slice(0, 300)); }
                  else { console.log("拿到 JWT，长度：", j.value.length); fs.writeFileSync("/tmp/jwt", j.value); }
                } catch (e) { console.log("解析失败：", e.message); }
              '
              echo
              echo "## 4. registry 侧 token-exchange（npm 实际走的接口）"
              if [ -f /tmp/jwt ]; then
                code2=$(curl -sS -o /tmp/ex.json -w '%{http_code}' -X POST \
                  -H "Authorization: Bearer $(cat /tmp/jwt)" \
                  "https://registry.npmjs.org/-/npm/v1/oidc/token-exchange/@qingwu-ui%2fai-editor" || echo "ERR")
                echo "registry token-exchange http: $code2"
                # 成功时的响应体是短期令牌，绝不落盘/落日志；只在失败时打印错误正文
                [ "$code2" = "200" ] || echo "错误正文：$(head -c 400 /tmp/ex.json | tr -d '\n')"
              else
                echo "跳过：没拿到 JWT"
              fi
            else
              echo "跳过：OIDC 环境变量缺失"
            fi
            echo
            echo "## 5. npm 调试日志尾部"
            tail -n 150 "$(ls -t /home/runner/.npm/_logs/*-debug-0.log 2>/dev/null | head -1)" 2>&1 || echo "(没有调试日志)"
          } > .ci-diag/report.txt 2>&1
          rm -f /tmp/jwt /tmp/oidc.json /tmp/ex.json
          git config user.name "qingwu-ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          git add -f .ci-diag/report.txt
          git commit -m "ci-diag: publish run #${{ github.run_number }}" || echo "无改动"
          git push --force origin "HEAD:refs/heads/ci-diag"

      # 发布成功后补阿里源同步；公司私服（proxy 上游=npmmirror）随之命中
      - name: Sync npmmirror
        if: ${{ !inputs.dry_run && steps.pub.outputs.published != '' }}
        run: bun tooling/npmmirror-sync/index.mjs ${{ steps.pub.outputs.published }}
