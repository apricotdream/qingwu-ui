# CI 发版 —— npm trusted publishing（OIDC），无需长效 token、不进 staged、2027-01 token 禁令后仍有效
#
# 前置（一次性）：每个包在 npmjs 网页 Settings → Trusted Publisher → Add GitHub Repository，
#   Owner=apricotdream / Repository=qingwu-ui / Workflow name=publish.yml（与下方 name 完全一致）
#
# 日常用法：本地对齐版本号 + CHANGELOG → push 到 GitHub main →
#   Actions → publish → Run workflow（packages 留空 = 自动发布所有"仓库有而 registry 无"的版本）
#   先勾 dry_run 可以看计划不真发。
name: publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "空格分隔包目录名（留空=自动检测全部版本差异）"
        required: false
        default: ""
      dry_run:
        description: "只列将要发布的包，不真发布"
        type: boolean
        default: false

permissions:
  contents: write # ⚠️ 临时：TP 审计报告回传用，审计完收回 read
  id-token: write # 向 GitHub 领取 OIDC 令牌，供 npm publish --provenance 验证

concurrency:
  group: publish
  cancel-in-progress: false # 发布中途绝不取消

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13" # 与 packageManager 一致

      # runner 自带 npm 10.9.9：OIDC trusted publishing（含 --provenance）需 npm ≥ 11.5.1，
      # npm 10 在本地预检即强制要 NODE_AUTH_TOKEN 抛 ENEEDAUTH、根本不发网络请求。
      # 装到独立前缀而不是 `sudo npm install -g npm@11`：sudo 走 secure_path，装出来的 npm 11
      # 落在 /usr/local/bin，而后续步骤 PATH 里排在前面的是 toolcache 自带的 npm 10，
      # 发布时用的仍是旧 npm。前置 bin 目录确保生效。
      - name: 装一份支持 OIDC 的 npm 11 并前置进 PATH
        run: |
          npm install -g npm@11 --prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          "$HOME/.npm-global/bin/npm" -v

      # 确认后面真正调用到的是 npm 11（PATH 被抢占时会静默退回 npm 10，
      # 症状是 registry 没收到任何请求就报 ENEEDAUTH）
      - run: |
          which npm
          npm -v

      # ⚠️ 临时审计（体检完删除）：逐包探测 registry 的 OIDC token-exchange，只换令牌不发布。
      # 必须在 publish.yml 里跑：JWT 带 job_workflow_ref，TP 是按 workflow 文件名授权的，
      # 放到别的 workflow（如 tp-audit.yml）里跑，所有包都会因工作流不匹配回 404「package not found」。
      - name: 逐包审计 Trusted Publisher（临时）
        run: |
          mkdir -p .ci-diag
          JWT=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value||""))')
          if [ -z "$JWT" ]; then echo "拿不到 OIDC JWT，中止"; exit 1; fi
          {
            echo "# Trusted Publisher 审计  $(date -u +%FT%TZ)  (workflow=publish.yml)"
            printf '%-28s %-5s %s\n' "包名" "HTTP" "registry 回复"
            for f in packages/*/package.json packages/*/ui/package.json; do
              [ -f "$f" ] || continue
              NAME=$(node -e 'process.stdout.write(require("./"+process.argv[1]).name)' "$f")
              # 与 npm 内部一致：npa(name).escapedName —— 保留 @，斜杠写成小写 %2f
              ENC=$(node -e 'process.stdout.write(process.argv[1].replace("/", "%2f"))' "$NAME")
              CODE=$(curl -sS -o /tmp/ex.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $JWT" \
                "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ENC" || echo "ERR")
              if [ "$CODE" = "201" ] || [ "$CODE" = "200" ]; then
                MSG="ok"
              else
                MSG=$(node -e 'const fs=require("node:fs");try{const j=JSON.parse(fs.readFileSync("/tmp/ex.json","utf8"));process.stdout.write((j.message||JSON.stringify(j)).slice(0,120))}catch(e){process.stdout.write("(无法解析)")}')
              fi
              printf '%-28s %-5s %s\n' "$NAME" "$CODE" "$MSG"
            done
          } > .ci-diag/tp-audit.txt 2>&1
          rm -f /tmp/ex.json
          cat .ci-diag/tp-audit.txt
          git config user.name "qingwu-ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          git add -f .ci-diag/tp-audit.txt
          git commit -m "tp-audit: ${{ github.run_number }}" || echo "无改动"
          git push --force origin "HEAD:refs/heads/ci-diag"

      - run: bun install --frozen-lockfile

      # 复用现有发布门禁：turbo build + publish-check（workspace 协议残留 / CHANGELOG 版本一致 / dist 齐全）
      - run: bun run release

      - id: pub
        run: bun tooling/ci-publish/index.mjs ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.packages }}

      # 发布成功后补阿里源同步；公司私服（proxy 上游=npmmirror）随之命中
      - name: Sync npmmirror
        if: ${{ !inputs.dry_run && steps.pub.outputs.published != '' }}
        run: bun tooling/npmmirror-sync/index.mjs ${{ steps.pub.outputs.published }}
