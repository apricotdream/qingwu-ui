# 青梧UI CI —— 只在 GitHub Actions 运行
# 本目录（.github/workflows/）天然只有 GitHub 执行：Gitee.com 不跑 GitHub Actions，
# Gitea 也只读取 .gitea/workflows/，因此推送到双远端（gitee + github）不会重复触发。
#
# 触发：push 到默认分支（2026-08）+ 任意 PR
# 内容：全量 CI（biome lint + turbo build + typecheck + test + size，含 examples/nextjs 演示站构建）
name: CI

on:
  push:
    branches: [2026-08]
  pull_request:

concurrency:
  # 同一 commit 的 push 与 pull_request（synchronize）事件共享一个组，避免 PR 期间双跑
  # push 事件取 github.sha；pull_request 事件取其 head.sha（与 push 的 sha 一致）
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / build / typecheck / test / size
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun（与 packageManager bun@1.3.13 对齐）
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          cache: true

      - name: 缓存（node_modules / turbo 本地缓存 / next 构建缓存）
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .turbo
            examples/nextjs/.next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-bun-

      - name: 安装依赖（锁文件冻结）
        run: bun install --frozen-lockfile

      - name: 全量 CI（biome lint + turbo build + typecheck + test + size）
        run: bun run ci

      - name: 校验演示站构建产物（examples/nextjs 必须产出 .next/BUILD_ID）
        run: test -d examples/nextjs/.next && test -f examples/nextjs/.next/BUILD_ID
